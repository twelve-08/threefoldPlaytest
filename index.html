<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Threefold</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#e6f0ea;--panel:#fafdfb;--ink:#0f261e;--mute:#527066;--line:#b3cdc2;--green:#1c8565;--green2:#28be91;--or:#e8650a;--x:#1c8565;--o:#d9651a;--hl:#fff0bd;--ter:#f2b800;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1713;--panel:#11221c;--ink:#e2f2ea;--mute:#87a99d;--line:#24463a;--green:#3fd3a8;--green2:#28be91;--or:#ff9a3d;--x:#3fd3a8;--o:#ff9a3d}}
:root[data-theme="dark"]{--bg:#0b1713;--panel:#11221c;--ink:#e2f2ea;--mute:#87a99d;--line:#24463a;--green:#3fd3a8;--green2:#28be91;--or:#ff9a3d;--x:#3fd3a8;--o:#ff9a3d}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font:15px/1.5 Archivo,system-ui,sans-serif}
.hidden{display:none!important}
.X{color:var(--x)}.O{color:var(--o)}
.b{font:600 14px Archivo,sans-serif;padding:7px 14px;border:2px solid var(--green);background:var(--panel);color:var(--green);cursor:pointer}
.b:hover:not(:disabled){background:var(--green);color:var(--bg)}.b:disabled{opacity:.45;cursor:default}
.b.or{border-color:var(--or);color:var(--or)}.b.or:hover:not(:disabled){background:var(--or);color:var(--bg)}
.b.big{font-size:20px;padding:12px 40px;background:var(--or);color:var(--bg);border-color:var(--or)}.b.big:hover{filter:brightness(1.1);background:var(--or)}
button:focus-visible,input:focus-visible{outline:2px solid var(--x);outline-offset:1px}
#view{position:fixed;inset:0;overflow:hidden;touch-action:none;background:var(--bg);cursor:default}
#world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
.stage{position:relative}.bw{position:absolute;pointer-events:none}.bs{width:100%;display:block;overflow:visible;pointer-events:none}
.tl{position:absolute;left:0;width:22px;text-align:right;font:500 13px Archivo,sans-serif;color:var(--mute)}
.ul{position:absolute;font:600 16px Archivo,sans-serif;color:var(--mute)}
.hit{fill:rgba(255,255,255,0);pointer-events:all;cursor:pointer}.hit:hover,.hit:focus-visible{fill:rgba(40,190,145,.3);outline:none}
.over .hit{pointer-events:none}
.pop{transform-box:fill-box;transform-origin:50% 100%;animation:pop .85s cubic-bezier(.16,1,.3,1) both}
@keyframes pop{from{opacity:0;transform:translateY(-28px) scale(.6)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.pop{animation:none}}
.hud{position:fixed;z-index:20}
#top{left:12px;top:12px;right:360px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;pointer-events:none}#top>*{pointer-events:auto}
.turn{font:700 17px Archivo,sans-serif;padding:6px 14px;background:var(--panel);border:2px solid var(--ink)}
.meta{color:var(--mute);font:500 13px Archivo,sans-serif}
#nlog{right:14px;top:12px;max-width:min(330px,38vw);display:flex;flex-wrap:wrap;justify-content:flex-end;gap:2px 10px;font:500 13px Archivo,sans-serif;color:color-mix(in srgb,var(--ink) 34%,transparent);pointer-events:none;text-align:right}
#nlog.full{color:var(--ink);pointer-events:auto;max-height:70vh;overflow:auto;background:var(--panel);border:2px solid var(--line);border-top:5px solid var(--green);padding:8px 10px}
#nlog.full b{font-weight:800}
#bot{left:50%;bottom:16px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:8px;max-width:94vw}
#msg{font-weight:600;color:var(--o);margin:0;text-align:center;background:var(--panel);padding:4px 12px;border:2px solid var(--or)}#msg:empty{display:none}
#modes{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}.b.on{background:var(--green);color:var(--bg)}
#ask{display:none;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 10px;background:var(--panel);border:2px solid var(--or)}
.screen{position:fixed;inset:0;z-index:50;background:var(--bg);overflow:auto;display:flex;flex-direction:column;align-items:center;padding:24px 16px}
.modal{position:fixed;inset:0;z-index:60;background:rgba(4,14,10,.6);display:flex;align-items:center;justify-content:center;padding:14px}
.card{background:var(--panel);border:2px solid var(--line);border-top:6px solid var(--or);padding:18px;max-width:600px;width:100%;max-height:92vh;overflow:auto}
.card h2{margin:0 0 10px;font-size:20px}
#menu .inner{max-width:640px;width:100%;display:flex;flex-direction:column;gap:16px;align-items:stretch}
#logo{width:100%;max-width:520px;display:block;margin:0 auto;background:#fff;border:2px solid var(--line)}
.lab{display:flex;flex-direction:column;gap:6px;font:600 13px Archivo,sans-serif}.lab small{font-weight:400;color:var(--mute)}
.seg{display:flex}.seg .b{flex:1;border-left-width:0}.seg .b:first-child{border-left-width:2px}
.mods{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:8px 18px}.mods label{cursor:pointer;font-weight:600}.mods small{display:block;font-weight:400;color:var(--mute)}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
#settings .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:16px 22px}
#settings input[type=color]{width:100%;height:38px;padding:0;border:2px solid var(--ink);background:none;cursor:pointer}
#settings input[type=range]{width:100%;accent-color:var(--green)}
#tut .card{max-width:860px}#tut img{width:100%;display:block;margin:0 0 12px;border:1px solid var(--line)}
#endL{display:flex;flex-wrap:wrap;gap:4px 12px;font:500 15px Archivo,sans-serif;margin:8px 0 14px;max-height:45vh;overflow:auto}
#endT{font-size:30px;font-weight:800}
</style></head><body>

/* CPU: same move generator as the player (time travel, branches, quantum merges, flips, wormholes).

function cpuMoves(st,who){const out=[];let mt=1;for(const U of st.unis)for(let k=N;k>=1;k--)if(U.b[k]){if(k>mt)mt=k;break}

    const r=play(st,u,t,c,who,{});

    for(let c=0;c<NC;c++)if(b[c]&&b[c]!=='Q')out.push({...flipAt(st,u,t,[c]),kind:'flipPiece',c,u0:u,t0:t});
    if(U.b.slice(t+1).some(Boolean))out.push({...flipAt(st,u,t,ALLC),kind:'flipBoard',c:-1,u0:u,t0:t})}
  if(OPT.tunneller)for(let su=0;su<st.unis.length;su++)for(let s0=1;s0<=N;s0++){const B=st.unis[su].b[s0];if(!B)continue;
    for(let sc=0;sc<NC;sc++){const pc=B[sc];if(!pc||pc==='Q')continue;
      for(let du=0;du<st.unis.length;du++)for(let dt=1;dt<=tm;dt++){if(du===su&&dt===s0)continue;const r=tunnel(st,su,s0,sc,du,dt,sc);if(!r.err)out.push({...r,kind:'tunnel',c:sc,u0:su,t0:s0,dt})}}}

const cpuWinningMoves=(st,who)=>cpuMoves(st,who).filter(r=>cpuWinFor(r.st,who,r.ch)===who);
function cpuChoose(st){const T0=performance.now(),all=cpuMoves(st,CPU);if(!all.length)return null;
  const sc=all.map(m=>{const w=cpuWinFor(m.st,CPU,m.ch);return{m,w,s:w===CPU?1e6:w?-1e6:cpuEval(m.st)}});
  const win=sc.find(x=>x.w===CPU);if(win)return win.m;
  sc.sort((a,b)=>b.s-a.s);let best=null,bv=-Infinity;

function cpuLabel(r){if(r.kind==='flipPiece')return'F'+co(r.c)+'-'+LET[r.u0]+r.t0;if(r.kind==='flipBoard')return'F'+LET[r.u0]+r.t0;

function cpuAct(){if(!OPT.cpu||CPU_BUSY||S.over||S.turn!==CPU)return;CPU_BUSY=true;msg('CPU is thinking\u2026');render();
  setTimeout(()=>{if(S.over||S.turn!==CPU){CPU_BUSY=false;return}const ch=cpuChoose(S);CPU_BUSY=false;msg('');if(!ch){render();return}
    if(ch.branch)msg('CPU created a new universe.'+(ch.q==='q'?' (quantum merge)':''));commit(ch.st,CPU,ch.ch,cpuLabel(ch))},150)}
function commit(n,who,ch,lab){

function act(u,t,c,q){
  if(S.over||CPU_BUSY||(OPT.cpu&&S.turn===CPU))return;const who=S.turn,U=S.unis[u],v=U.b[t]?U.b[t][c]:'';msg('');PEND=null;
  if(MODE==='flipP'){if(!v||v==='Q'){msg('Pick a piece to flip (quantum pieces can\u2019t be flipped).');render();return}
    const r=flipAt(S,u,t,[c]);return commit(r.st,who,r.ch,'F'+co(c)+'-'+LET[u]+t)}

/* Geometry helpers (isometric or flat) */
const G=()=>GEO[BS][THEME.view];
function cellC(c){const g=G();if(THEME.view==='flat')return g.cells[c];const l=c%BS,n=BS-1-(c/BS|0);return[g.L0[0]+g.a*(l+n),g.L0[1]+g.b*(l-n)]}

function rimPts(){const g=G();if(THEME.view==='flat'){const[x,y,w,h]=g.vb;return`${x},${y} ${x+w},${y} ${x+w},${y+h} ${x},${y+h}`}
  const[lx,ly]=g.L0,n=BS-1;return`${lx-g.a},${ly} ${lx+g.a*n},${ly-g.b*n-g.b} ${lx+2*g.a*n+g.a},${ly} ${lx+g.a*n},${ly+g.b*n+g.b}`}

  const win=(b&&line(b).length)||(S.wb&&S.wb.some(([x,k])=>x===u&&k===t)),last=S.last.some(([x,k])=>x===u&&k===t);
  let h=`<svg class="bs" viewBox="${g.vb.join(' ')}" role="group" aria-label="Universe ${LET[u]}, time ${t}${b?'':', frozen'}">`;
  h+=b?g.art:`<g opacity=".28">${g.art}</g><polygon points="${rimPts()}" fill="none" stroke="var(--mute)" stroke-width="${sw*.7}" stroke-dasharray="${sw*2.4} ${sw*1.6}" opacity=".7"/>`;
  if(win||last)h+=`<polygon points="${rimPts()}" fill="none" style="stroke:${win?'var(--green2)':'var(--ter)'}" stroke-width="${sw}"/>`;
  if(b){const ps=[];for(let c=0;c<NC;c++)if(b[c]){const v=b[c],[cx,cy]=cellC(c),r=(flat?PFR:REF)[v[0]],key=u+':'+t+':'+c;PCN[key]=v;const nw=READY&&!RM&&PC[key]!==v;
      const fl=v[0]==='X'?THEME.xRot:v[0]==='O'?THEME.oRot:0;
      ps.push([cy,`<g transform="translate(${cx} ${cy}) scale(${g.k}) translate(${-r[0]} ${-r[1]})"><g${nw?' class="pop"':''}${fl?` style="filter:hue-rotate(${fl}deg)"`:''}>${(flat?PF:PA)[v]}</g></g>`])}

  if(TUNNEL&&TUNNEL[0]===u&&TUNNEL[1]===t)h+=`<polygon points="${cellPts(TUNNEL[2])}" fill="none" stroke="var(--hl)" stroke-width="${sw*.7}" pointer-events="none"/>`;
  for(let c=0;c<NC;c++){const p=b?b[c]:'';
    h+=`<polygon class="hit" data-u="${u}" data-t="${t}" data-c="${c}" tabindex="0" role="button" aria-label="Universe ${LET[u]}, time ${t}, ${co(c)}${p?', '+p:''}" points="${cellPts(c)}"/>`;
    if(TUNNEL&&c===TUNNEL[2]&&!(TUNNEL[0]===u&&TUNNEL[1]===t))h+=`<polygon points="${cellPts(c)}" fill="rgba(255,240,189,.18)" stroke="var(--hl)" stroke-width="${sw*.3}" stroke-dasharray="${sw} ${sw*.7}" pointer-events="none"/>`}
  return h+'</svg>'}
const fmt=m=>m.replace(/^([#&]?)([XO])(.*)$/,(_,o,p,r)=>`<span class="${p}">${o?'<b>'+o+'</b>':''}${p}${r}</span>`);

/* Camera: right-drag pan with inertia, smoothed wheel zoom, touch pan/pinch */
const CAM={x:0,y:0,z:1,tz:1,zx:0,zy:0,vx:0,vy:0,drag:false,user:false,fit:false,fx:0,fy:0,fz:1,moved:false};
const clampZ=z=>Math.max(.08,Math.min(5,z));
function fit(anim){const vw=innerWidth,vh=innerHeight,z=Math.min((vw-80)/ST.w,(vh-150)/ST.h,1.7);CAM.fz=z;CAM.fx=(vw-ST.w*z)/2;CAM.fy=(vh-ST.h*z)/2+10;
  if(anim)CAM.fit=true;else{CAM.x=CAM.fx;CAM.y=CAM.fy;CAM.z=CAM.tz=z;CAM.fit=false;CAM.vx=CAM.vy=0}}
function zoomAt(px,py,f){const nz=clampZ(CAM.z*f),k=nz/CAM.z;CAM.x=px-(px-CAM.x)*k;CAM.y=py-(py-CAM.y)*k;CAM.z=CAM.tz=nz}

  if(C.fit){C.x+=(C.fx-C.x)*.14;C.y+=(C.fy-C.y)*.14;C.z+=(C.fz-C.z)*.14;C.tz=C.z;if(Math.abs(C.fx-C.x)+Math.abs(C.fy-C.y)+Math.abs(C.fz-C.z)*400<.3)C.fit=false}
  else{if(Math.abs(C.tz-C.z)>1e-4){const nz=C.z+(C.tz-C.z)*.16,k=nz/C.z;C.x=C.zx-(C.zx-C.x)*k;C.y=C.zy-(C.zy-C.y)*k;C.z=nz}
    if(!C.drag){C.x+=C.vx;C.y+=C.vy;C.vx*=.93;C.vy*=.93;if(Math.abs(C.vx)<.02)C.vx=0;if(Math.abs(C.vy)<.02)C.vy=0}}
  $('world').style.transform=`translate(${C.x}px,${C.y}px) scale(${C.z})`;requestAnimationFrame(loop)}
const V=$('view'),PT=new Map();let lastD=0;
V.addEventListener('contextmenu',e=>e.preventDefault());

  if(e.button===2||e.button===1||e.pointerType==='touch'){CAM.drag=true;CAM.fit=false;CAM.vx=CAM.vy=0;CAM.tz=CAM.z;if(e.pointerType!=='touch')V.setPointerCapture(e.pointerId)}

/* Theme */
const DEF={pri:'#1c8565',sec:'#e8650a',ter:'#f2b800'};
const THEME={pri:DEF.pri,sec:DEF.sec,ter:DEF.ter,mode:'auto',xRot:0,oRot:0,sp:0,view:'iso'};
try{const s=JSON.parse(localStorage.getItem('threefold_theme')||'{}');if(s.pri)THEME.pri=s.pri;if(s.sec)THEME.sec=s.sec;if(s.ter)THEME.ter=s.ter;if(s.mode)THEME.mode=s.mode;if(typeof s.sp==='number')THEME.sp=s.sp;if(s.view)THEME.view=s.view}catch(e){}
function hexHue(h){h=h.replace('#','');if(h.length===3)h=h.split('').map(x=>x+x).join('');const r=parseInt(h.slice(0,2),16)/255,g=parseInt(h.slice(2,4),16)/255,b=parseInt(h.slice(4,6),16)/255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn;let H=0;if(d){if(mx===r)H=60*((g-b)/d%6);else if(mx===g)H=60*((b-r)/d+2);else H=60*((r-g)/d+4)}if(H<0)H+=360;return H}
function mix(h,amt){h=h.replace('#','');const r=parseInt(h.slice(0,2),16),g=parseInt(h.slice(2,4),16),b=parseInt(h.slice(4,6),16);const m=(v)=>Math.round(v+(amt>0?(255-v)*amt:v*amt));return'#'+[m(r),m(g),m(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
const GS=[...document.querySelectorAll('#g2 stop,#g3 stop')],GS0=GS.map(g=>g.getAttribute('stop-color'));
function syncUI(){
  $('sPri').value=THEME.pri;$('sSec').value=THEME.sec;$('sTer').value=THEME.ter;$('sSp').value=THEME.sp;$('sSpv').textContent=THEME.sp?THEME.sp+'%':'Tight';
  document.querySelectorAll('#sMode .b').forEach(b=>b.classList.toggle('on',b.dataset.mode===THEME.mode));
  document.querySelectorAll('#sView .b').forEach(b=>b.classList.toggle('on',b.dataset.v===THEME.view));
}
function applyTheme(){
  const R=document.documentElement.style;
  const def=THEME.pri==='#1c8565'&&THEME.sec==='#e8650a';
  if(def){['--green','--green2','--x','--or','--o'].forEach(v=>R.removeProperty(v))}
  else{R.setProperty('--green',THEME.pri);R.setProperty('--green2',mix(THEME.pri,0.25));R.setProperty('--x',THEME.pri);R.setProperty('--or',THEME.sec);R.setProperty('--o',mix(THEME.sec,-0.15))}
  THEME.xRot=def?0:Math.round(hexHue(THEME.pri)-hexHue('#1c8565'));
  THEME.oRot=def?0:Math.round(hexHue(THEME.sec)-hexHue('#e8650a'));
  if(THEME.mode==='auto')document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme',THEME.mode);
  try{localStorage.setItem('threefold_theme',JSON.stringify({pri:THEME.pri,sec:THEME.sec,ter:THEME.ter,mode:THEME.mode,sp:THEME.sp,view:THEME.view}))}catch(e){}
  if(THEME.ter===DEF.ter)R.removeProperty('--ter');else R.setProperty('--ter',THEME.ter);
  const dq=def&&THEME.ter===DEF.ter;
  GS.forEach((g,i)=>g.setAttribute('stop-color',dq?GS0[i]:[THEME.sec,mix(THEME.pri,-0.18),THEME.sec,THEME.ter,mix(THEME.pri,0.25)][i]));
  syncUI();
  if(typeof S!=='undefined'&&S)render();
}
addEventListener('message',e=>{if(e.data&&e.data.type==='threefold-theme'){const d=e.data;if(d.pri)THEME.pri=d.pri;if(d.sec)THEME.sec=d.sec;if(d.ter)THEME.ter=d.ter;if(typeof d.sp==='number')THEME.sp=d.sp;if(d.mode)THEME.mode=d.mode;if(d.view)THEME.view=d.view;applyTheme()}});

$('sView').querySelectorAll('.b').forEach(b=>b.onclick=()=>{THEME.view=b.dataset.v;applyTheme()});
[['sPri','pri'],['sSec','sec'],['sTer','ter']].forEach(([id,k])=>$(id).oninput=e=>{THEME[k]=e.target.value;applyTheme()});
$('sSp').oninput=e=>{THEME.sp=+e.target.value;applyTheme()};
document.querySelectorAll('#sMode .b').forEach(b=>b.onclick=()=>{THEME.mode=b.dataset.mode;applyTheme()});
$('sReset').onclick=()=>{Object.assign(THEME,DEF,{mode:'auto',sp:0});applyTheme()};
setBoard();applyTheme();requestAnimationFrame(loop);
